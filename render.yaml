services:
  - type: web
    name: neural-expert-lottery
    runtime: node
    plan: free
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/lottery-app run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString

databases:
  - name: lottery-db
    plan: basic-256mb
    databaseName: lottery_db
    user: lottery_user
